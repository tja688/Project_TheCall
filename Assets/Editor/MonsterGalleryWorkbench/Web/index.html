<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="icon" href="data:," />
  <title>怪物立绘抽查</title>
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <header>
    <div class="title">
      <strong>怪物立绘抽查</strong>
      <span>12 个成品模板，整套色卡与出生饰品。浅色方块是游戏里 279×299 的画像框，放大了两倍。</span>
    </div>
    <div class="status">
      <span id="connectionBadge" data-ok="0">未连接</span>
      <span id="statusLine">正在连接编辑器</span>
    </div>
  </header>
  <div class="filters" id="filters">
    <button type="button" data-source="any">全部</button>
    <button type="button" data-source="opening">开局</button>
    <button type="button" data-source="shop">商店</button>
    <button type="button" data-source="breed">培育</button>
  </div>
  <main>
    <section class="stage">
      <img id="portrait" alt="当前怪物立绘" />
      <p id="empty">还没有怪物。</p>
    </section>
    <aside>
      <form id="preview-controls">
        <div class="control-grid">
          <label>模板<select id="template-choice" name="template"></select></label>
          <label>整套色卡<select id="palette-choice" name="palette"></select></label>
          <label>头饰<select id="head-choice" name="head"><option value="0">无附加头饰</option><option value="1">短角</option><option value="2">纹角</option><option value="3">蝴蝶结</option></select></label>
          <label>背饰<select id="back-choice" name="back"><option value="0">无附加背饰</option><option value="1">蝙蝠翼</option><option value="2">羽翼</option></select></label>
          <label>性格<select id="personality-choice" name="personality"></select></label>
          <label>心情<select id="mood-choice" name="mood"></select></label>
        </div>
        <div id="palette-preview" aria-label="身体、花纹、眼部、嘴部色卡"></div>
        <button type="submit">应用固定预览</button>
        <p class="hint">只调整抽查样本，不改对局。花纹同色略深，眼嘴异色。</p>
      </form>
      <details class="reference"><summary>美术成品参考图</summary><img src="/reference.jpg" alt="12 个成品怪物参考图" /></details>
      <h2 id="summary">—</h2>
      <dl id="facts"></dl>
      <details>
        <summary>部件叠放顺序</summary>
        <div class="parts" id="parts"></div>
      </details>
    </aside>
  </main>
  <footer>
    <div class="actions">
      <button type="button" id="previous">上一只</button>
      <button type="button" id="roll" class="primary">随机下一只</button>
      <button type="button" id="next">下一只</button>
      <button type="button" id="pose">换个姿势</button>
    </div>
    <p id="errorLine"></p>
    <p class="hint">空格随机新的一只，左右方向键翻记录，P 换姿势。</p>
    <div class="strip" id="strip"></div>
  </footer>
  <script src="/app.js"></script>
</body>
</html>
