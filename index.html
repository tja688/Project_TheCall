<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <title>能量产出台</title>
  <link rel="stylesheet" href="./bench.css">
</head>
<body>
  <div id="app">
    <header id="bar">
      <p id="status">正在装入规则。</p>
      <label>关卡 <select id="level"></select></label>
      <div id="tools"></div>
      <button id="settle" type="button">结算</button>
      <p id="report" class="pending">尚未结算</p>
    </header>
    <section id="bench-panel">
      <h1>能量产出台</h1>
      <div id="cells"></div>
    </section>
    <div id="lower">
      <section id="library">
        <div class="panel-head">
          <h2>怪物库</h2>
          <p class="panel-note">拖进格子后按出现顺序编号，例如 1号怪物、2号怪物。编号一直跟着这只怪物，不跟技能名走。</p>
        </div>
        <div id="monster-grid"></div>
      </section>
      <div id="side">
        <section id="skill-slots">
          <h2>技能槽</h2>
          <div id="slot-row"></div>
        </section>
        <section id="skill-library">
          <h2>技能库</h2>
          <div id="skill-grid"></div>
        </section>
      </div>
    </div>
    <section id="ledger">
      <h2>结算</h2>
      <div id="ledger-summary">
        <p class="stat"><span>本次产出</span><strong>—</strong></p>
        <p class="stat"><span>本关应交</span><strong>—</strong></p>
        <p class="stat"><span>交款</span><strong>尚未结算</strong></p>
        <p class="stat"><span>超额线</span><strong>—</strong></p>
        <p class="stat"><span>超额</span><strong>尚未结算</strong></p>
      </div>
      <p id="ledger-note">按时间顺序读。每一条是一只怪物触发的一次技能：先报价，再加项，得到底数；侧向技能还要乘那一侧的怪物数；能量等于底数乘倍率。</p>
      <div id="ledger-body">
        <p class="ledger-empty">还没有结算。怪物放上格子后点结算，时间线会列在这里。</p>
      </div>
    </section>
  </div>
  <script type="module" src="./bench.js"></script>
</body>
</html>
